# ── CHROMOSOME 7: KNOWLEDGE PATHS ───────────────
# On-disk layout for knowledge hub and derived folders.
knowledge:
  master_hub: "C:\\path\\to\\.knowledge"
  project_knowledge_pattern: "{project_path}\\.knowledge"
  meeting_folder_pattern: "meetings\\{YYYY-MM-DD}_{topic}"
  session_folder_pattern: "sessions\\{YYYY-MM-DD}_{topic}"
  rules_path: "rules"
  references_path: "references"
  decisions_path: "decisions"

# ── CHROMOSOME 8: AGENTS (Paperclip) ────────────
# Multi-agent orchestration (or swap platform name if you use another tool).
agents:
  platform: "paperclip"  # orchestration product identifier
  api_url: "http://localhost:3100/api"  # REST base URL for agent API
  ui_url: "http://localhost:3100"  # browser UI for monitoring
  hierarchy:
    tier_1: "CEO"  # top-level agent / role label
    tier_2: "Shared Services"
    tier_3: "Project Leads"
    tier_4: "Specialists"
  total_agents: 0  # approximate count of configured agents

# ── CHROMOSOME 9: PREFERENCES ───────────────────
# UI refresh, automation, and quiet hours for notifications.
preferences:
  theme: "dark"  # dark | light | system
  dashboard_refresh: 30  # seconds between dashboard polls
  meeting_auto_download: true  # fetch recordings/transcripts when available
  auto_summarize: true  # generate summaries after meetings/sessions
  auto_assign_actions: true  # propose owners for action items
  notification_quiet_hours:
    start: "23:00"  # HH:MM — suppress non-critical alerts after this
    end: "08:00"  # HH:MS — resume normal notifications after this
  language: "en"  # UI and generated-summary language code
  date_format: "YYYY-MM-DD"  # display format for dates in tools

# ── CHROMOSOME 10: SECURITY ─────────────────────
# Policy defaults for sessions, secrets, and compliance labeling.
security:
  encryption_key_vault: "azure"  # azure | hashicorp | local — where keys live
  token_rotation_days: 90  # reminder / policy for rotating API tokens
  session_timeout_minutes: 15  # idle timeout for authenticated sessions
  mfa_enabled: true  # whether you require MFA for human-facing apps
  ip_allowlist: []  # optional list of allowed IPs/CIDRs; empty = no filter
  audit_retention_days: 2555  # ~7 years of audit log retention target
  data_classification_default: "internal"  # default label for new artifacts
