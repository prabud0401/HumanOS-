#
# TEMPLATE: Copy to identity.yaml and fill in real values.
# Never commit identity.yaml with secrets — use .env for credentials.

# ── CHROMOSOME 1: IDENTITY ──────────────────────
# Who the digital twin represents (display + locale).
identity:
  # Short / preferred first name for greetings and UI
  name: "Your Name"
  # Legal or full display name
  full_name: "Your Full Name"
  # Informal name if different from name
  nickname: "Your Nickname"
  # IANA timezone for scheduling (e.g. America/New_York, Asia/Kolkata)
  timezone: "Your/Timezone"
  # BCP 47 locale for formatting dates and numbers
  locale: "en-US"
  # Optional path to profile photo; null if none
  avatar: null

# ── CHROMOSOME 2: PERSONALITY ────────────────────
# Voice, decision style, work window, and when to escalate to a human.
personality:
  # direct | diplomatic | casual | formal
  communication_style: "direct"
  # fast | deliberate | analytical
  decision_speed: "fast"
  # conservative | moderate | aggressive
  risk_tolerance: "moderate"
  work_hours:
    # HH:MM in work_hours.timezone
    start: "09:00"
    # HH:MM — end of typical availability
    end: "18:00"
    timezone: "Your/Timezone"
  # e.g. professional-casual
  response_tone: "professional-casual"
  # low | medium | high — auto-delegate vs ask
  delegation_preference: "high"
  # 0.0–1.0; below this confidence, ask the real human
  escalation_threshold: 0.6

# ── CHROMOSOME 3: PROFESSIONAL ───────────────────
# Role, company, skills, and project registry (paths are machine-specific).
professional:
  role: "Your Job Title"
  company: "Your Company"
  specializations:
    - "Your specialization 1"
    - "Your specialization 2"
    - "Your specialization 3"
  tech_stack:
    frontend: ["Your", "Frontend", "Stack"]
    backend: ["Your", "Backend", "Stack"]
    databases: ["Your", "Databases"]
    cloud: ["Your", "Cloud", "Services"]
    ai: ["Your", "AI", "Providers"]
    tools: ["Your", "DevTools"]
  projects:
    active:
      - slug: "example-a"
        name: "Example Active Project A"
        path: "C:\\path\\to\\project-a"
      - slug: "example-b"
        name: "Example Active Project B"
        path: "C:\\path\\to\\project-b"
      - slug: "example-c"
        name: "Example Active Project C"
        path: "C:\\path\\to\\project-c"
      - slug: "example-d"
        name: "Example Active Project D"
        path: "C:\\path\\to\\project-d"
    paused:
      - slug: "paused-1"
        name: "Paused Project One"
      - slug: "paused-2"
        name: "Paused Project Two"
      - slug: "paused-3"
        name: "Paused Project Three"
      - slug: "paused-4"
        name: "Paused Project Four"
      - slug: "paused-5"
        name: "Paused Project Five"
      - slug: "paused-6"
        name: "Paused Project Six"

# ── CHROMOSOME 4: AI ENGINE ─────────────────────
# Models, adapter, and vector/RAG defaults.
ai_engine:
  primary_model: "your-primary-model-id"
  adapter: "your_adapter_name"
  fallback_model: "your-fallback-model-id"
  temperature: 0.3
  max_context_tokens: 200000
  speech_to_text: "your-stt-model-id"
  embedding_model: "your-embedding-model-id"
  # chromadb | pinecone | azure-cognitive-search
  vector_db: "chromadb"

# ── CHROMOSOME 5: CONNECTIONS ────────────────────
# OAuth and webhooks: ${VAR} resolved from environment / .env.
connections:
  platforms:
    microsoft:
      tenant_id: "${AZURE_TENANT_ID}"
      client_id: "${AZURE_CLIENT_ID}"
      client_secret: "${AZURE_CLIENT_SECRET}"
      scopes:
        - "OnlineMeetings.Read"
        - "CallRecords.Read.All"
        - "Chat.Read"
        - "Calendars.Read"
        - "Mail.Read"
        - "Files.Read.All"
    google:
      client_id: "${GOOGLE_CLIENT_ID}"
      client_secret: "${GOOGLE_CLIENT_SECRET}"
      scopes:
        - "calendar.readonly"
        - "drive.readonly"
        - "gmail.readonly"
    zoom:
      account_id: "${ZOOM_ACCOUNT_ID}"
      client_id: "${ZOOM_CLIENT_ID}"
      client_secret: "${ZOOM_CLIENT_SECRET}"
    github:
      token: "${GITHUB_TOKEN}"
      org: "your-github-org"
    slack:
      bot_token: "${SLACK_BOT_TOKEN}"

  communication:
    # teams | slack | email
    primary: "teams"
    notification_channels:
      - type: "teams"
        webhook: "${TEAMS_WEBHOOK_URL}"
      - type: "email"
        smtp_host: "smtp.example.com"
        smtp_port: 587
        from: "${EMAIL_ADDRESS}"

