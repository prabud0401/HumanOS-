<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HumanOS{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bio: {
              50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac',
              400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d',
              800: '#166534', 900: '#14532d', 950: '#052e16',
            },
            neural: {
              50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
              400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',
              800: '#1e40af', 900: '#1e3a8a', 950: '#172554',
            },
            pulse: { healthy: '#22c55e', degraded: '#f59e0b', unhealthy: '#ef4444' },
          }
        }
      }
    }
  </script>
  <style>
    @keyframes pulse-glow { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
    .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
    .organ-dot { transition: all 0.3s ease; }
    .organ-dot:hover { transform: scale(1.4); filter: brightness(1.3); }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-block; }
    .htmx-request.htmx-indicator { display: inline-block; }
    .chat-msg { animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="h-full bg-gray-950 text-gray-100" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <div class="flex h-full">
    {% include "partials/sidebar.html" %}
    <main class="flex-1 overflow-y-auto">
      <header class="sticky top-0 z-10 bg-gray-950/80 backdrop-blur border-b border-gray-800 px-6 py-4 flex items-center justify-between">
        <div>
          <h1 class="text-xl font-bold">{% block page_title %}Dashboard{% endblock %}</h1>
          <p class="text-sm text-gray-500">{% block page_subtitle %}{% endblock %}</p>
        </div>
        <div class="flex items-center gap-3">
          <span id="system-status" class="flex items-center gap-2 text-sm"
                hx-get="/ui/api/status-badge/" hx-trigger="load, every 30s" hx-swap="innerHTML">
            <span class="w-2 h-2 rounded-full bg-gray-600"></span> Loading...
          </span>
        </div>
      </header>
      <div class="p-6">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
